name: Suggest AI fix

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to diagnose
        type: string
        required: true
        default: feature/overhaul
      context:
        description: Sanitized Nix warning or failure context (never paste secrets)
        type: string
        required: true

jobs:
  suggest:
    name: Draft a candidate fix
    runs-on: docker
    timeout-minutes: 60

    steps:
      - name: Check out failing revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            curl \
            git \
            jq \
            pipx \
            python3-venv \
            sudo
          pipx install aider-chat==0.86.2
          ln --symbolic "$HOME/.local/bin/aider" /usr/local/bin/aider

      - name: Confirm local model is available
        run: |
          curl --fail --silent --show-error \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 10 \
            http://docker-in-docker:11434/v1/models \
            | jq --exit-status '.data[] | select(.id == "qwen2.5-coder:7b")' \
            >/dev/null

      - name: Collect current-flake diagnostics
        env:
          PROVIDED_CONTEXT: ${{ inputs.context }}
        run: |
          if [ -z "$PROVIDED_CONTEXT" ]; then
            echo "Sanitized failure context is required."
            exit 1
          fi

          {
            echo '# Nix configuration repair request'
            echo
            echo 'Work only from the checked-out repository, its locked flake inputs, and the supplied diagnostics.'
            echo 'Treat remembered NixOS package and option names as untrusted.'
            echo 'If the repository and diagnostics do not establish a safe correction, make no changes.'
            echo 'Make the smallest source change that addresses the supplied warning or failure.'
            echo 'Do not edit flake.lock, secrets, encrypted files, or Forgejo workflows.'
            echo 'Do not deploy, switch, rebase, merge, or modify external systems.'
            echo 'A separate isolated MicroVM CI job will validate any pull request.'
            echo
            echo '## User-provided context'
            printf '%s\n' "$PROVIDED_CONTEXT"
            echo
            echo '## Locked flake inputs'
            jq '{root, nodes: (.nodes | with_entries(.value |= {locked, original, inputs}))}' flake.lock
          } > /tmp/repair-prompt.md

      - name: Generate candidate patch
        env:
          OPENAI_API_BASE: http://docker-in-docker:11434/v1
          OPENAI_API_KEY: local-no-key
        run: |
          printf '%s\n' \
            '.forgejo/workflows/**' \
            'secrets/**' \
            '**/*.age' \
            '.sops.yaml' \
            'flake.lock' \
            > /tmp/aiderignore

          aider \
            --model openai/qwen2.5-coder:7b \
            --yes-always \
            --no-auto-commits \
            --no-gitignore \
            --no-analytics \
            --aiderignore /tmp/aiderignore \
            --chat-history-file /tmp/aider-history.md \
            --input-history-file /tmp/aider-input-history \
            --read /tmp/repair-prompt.md \
            --message 'Produce a minimal candidate patch for the supplied Nix warning or failure. Do not claim it is validated; Forgejo MicroVM CI will validate the pull request.'

      - name: Enforce edit boundaries
        run: |
          changed_files="$(git diff --name-only)"

          if [ -z "$changed_files" ]; then
            echo "The agent did not produce a patch."
            exit 1
          fi

          if printf '%s\n' "$changed_files" | grep --extended-regexp --quiet \
            '(^|/)(secrets|credentials|\.forgejo/workflows)(/|$)|(^|/)(\.env|\.sops\.yaml|id_rsa)$|\.(age|key|pem)$|^flake\.lock$'; then
            echo "The agent attempted to modify a protected path:"
            printf '%s\n' "$changed_files"
            exit 1
          fi

          changed_count="$(printf '%s\n' "$changed_files" | wc --lines)"
          if [ "$changed_count" -gt 10 ]; then
            echo "The candidate exceeds the 10-file safety limit."
            exit 1
          fi

          if git diff --numstat | grep --quiet '^-[[:space:]]'; then
            echo "Binary changes are not permitted."
            exit 1
          fi

          changed_lines="$(git diff --numstat | awk '{ added += $1; removed += $2 } END { print added + removed }')"
          if [ "$changed_lines" -gt 1000 ]; then
            echo "The candidate exceeds the 1000-line safety limit."
            exit 1
          fi

      - name: Preflight candidate
        run: |
          git diff --check

      - name: Create draft fix pull request
        env:
          AI_FORGEJO_TOKEN: ${{ secrets.AI_FORGEJO_TOKEN }}
          FORGEJO_API_URL: https://git.hestallo.com/api/v1
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_RUN_ID: ${{ github.run_id }}
        run: |
          branch="ai/fix-run-${FORGEJO_RUN_ID}"
          base="feature/overhaul"

          git config user.name "ai-fixer"
          git config user.email "ai-fixer@noreply.hestallo.com"
          git switch --create "$branch"
          git add --all
          git commit -m "fix: propose repair for CI run ${FORGEJO_RUN_ID}"

          authenticated_url="https://ai-fixer:${AI_FORGEJO_TOKEN}@git.hestallo.com/${FORGEJO_REPOSITORY}.git"
          git push "$authenticated_url" "HEAD:refs/heads/$branch"

          body="$(printf '%s\n' \
            'This is an AI-generated candidate fix.' \
            '' \
            "- Source revision: ${{ inputs.ref }}" \
            "- Fixer workflow run: ${FORGEJO_RUN_ID}" \
            '- Grounding: repository flake.lock and sanitized CI diagnostics' \
            '- Local validation by fixer: whitespace and edit-boundary checks only' \
            '- Deployment performed: no' \
            '- Merge performed: no' \
            '' \
            'Normal Forgejo CI must pass before this draft is considered for manual review.')"

          payload="$(jq --null-input \
            --arg base "$base" \
            --arg head "$branch" \
            --arg title "fix: AI suggestion for run ${FORGEJO_RUN_ID}" \
            --arg body "$body" \
            '{base: $base, head: $head, title: $title, body: $body, draft: true, assignees: ["forgejo"]}')"

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: token ${AI_FORGEJO_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/pulls" \
            | jq '{number, title, html_url}'
