name: Suggest AI fix

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to diagnose
        required: true
        default: feature/overhaul
      context:
        description: Optional sanitized failure context
        required: false

jobs:
  suggest:
    name: Draft a candidate fix
    runs-on: docker
    timeout-minutes: 60

    steps:
      - name: Check out failing revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Prepare tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            curl \
            git \
            jq \
            pipx \
            python3-venv \
            sudo
          pipx install aider-chat
          ln --symbolic "$HOME/.local/bin/aider" /usr/local/bin/aider

      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
            max-jobs = 1

      - name: Verify Nix
        run: |
          sandbox="$(nix config show sandbox)"
          max_jobs="$(nix config show max-jobs)"
          printf 'sandbox=%s\n' "$sandbox"
          printf 'max-jobs=%s\n' "$max_jobs"
          test "$sandbox" = true
          test "$max_jobs" = 1

      - name: Confirm local model is available
        run: |
          curl --fail --silent --show-error \
            http://docker-in-docker:11434/v1/models \
            | jq --exit-status '.data[] | select(.id == "qwen2.5-coder:7b")' \
            >/dev/null

      - name: Collect current-flake diagnostics
        env:
          PROVIDED_CONTEXT: ${{ inputs.context }}
        run: |
          set +e
          nix flake metadata --json > /tmp/flake-metadata.json 2>/tmp/metadata-errors.log
          nix flake check --no-update-lock-file --print-build-logs \
            > /tmp/check.log 2>&1
          check_status=$?
          set -e

          if [ "$check_status" -eq 0 ] && [ -z "$PROVIDED_CONTEXT" ]; then
            echo "The selected revision currently passes flake checks; there is no failure to repair."
            exit 1
          fi

          {
            echo '# Repair request'
            echo
            echo 'Work only from the checked-out repository, its locked flake inputs, and the diagnostics below.'
            echo 'Do not rely on remembered NixOS package or option names when the current flake disagrees.'
            echo 'Make the smallest source change that addresses the failure.'
            echo 'Do not edit flake.lock, secrets, encrypted files, or Forgejo workflows.'
            echo 'Do not deploy, switch, rebase, merge, or modify external systems.'
            echo
            echo '## User-provided context'
            printf '%s\n' "$PROVIDED_CONTEXT"
            echo
            echo '## Current flake metadata'
            jq '{locks: .locks, path: .path, resolvedUrl: .resolvedUrl}' /tmp/flake-metadata.json 2>/dev/null || true
            echo
            echo '## Current check output'
            tail -n 500 /tmp/check.log
          } > /tmp/repair-prompt.md

      - name: Generate candidate patch
        env:
          OPENAI_API_BASE: http://docker-in-docker:11434/v1
          OPENAI_API_KEY: local-no-key
        run: |
          printf '%s\n' \
            '.forgejo/workflows/**' \
            'secrets/**' \
            '**/*.age' \
            '.sops.yaml' \
            'flake.lock' \
            > /tmp/aiderignore

          aider \
            --model openai/qwen2.5-coder:7b \
            --yes-always \
            --no-auto-commits \
            --no-gitignore \
            --no-analytics \
            --aiderignore /tmp/aiderignore \
            --chat-history-file /tmp/aider-history.md \
            --input-history-file /tmp/aider-input-history \
            --read /tmp/repair-prompt.md \
            --test-cmd 'nix flake check --no-update-lock-file --print-build-logs' \
            --auto-test \
            --message 'Produce a minimal candidate fix for the supplied failure. Keep the existing architecture and explain uncertain choices in code comments only when necessary.'

      - name: Enforce edit boundaries
        run: |
          changed_files="$(git diff --name-only)"

          if [ -z "$changed_files" ]; then
            echo "The agent did not produce a patch."
            exit 1
          fi

          if printf '%s\n' "$changed_files" | grep --extended-regexp --quiet \
            '(^|/)(secrets|\.forgejo/workflows)(/|$)|(^|/)\.sops\.yaml$|\.age$|^flake\.lock$'; then
            echo "The agent attempted to modify a protected path:"
            printf '%s\n' "$changed_files"
            exit 1
          fi

      - name: Format and preflight candidate
        run: |
          nix fmt -- .
          git diff --check
          nix flake check --no-update-lock-file --print-build-logs

      - name: Create draft fix pull request
        env:
          AI_FORGEJO_TOKEN: ${{ secrets.AI_FORGEJO_TOKEN }}
          FORGEJO_API_URL: https://git.hestallo.com/api/v1
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_RUN_ID: ${{ github.run_id }}
        run: |
          branch="ai/fix-run-${FORGEJO_RUN_ID}"
          base="feature/overhaul"

          git config user.name "ai-fixer"
          git config user.email "ai-fixer@noreply.hestallo.com"
          git switch --create "$branch"
          git add --all
          git commit -m "fix: propose repair for CI run ${FORGEJO_RUN_ID}"

          authenticated_url="https://ai-fixer:${AI_FORGEJO_TOKEN}@git.hestallo.com/${FORGEJO_REPOSITORY}.git"
          git push "$authenticated_url" "HEAD:refs/heads/$branch"

          body="$(printf '%s\n' \
            'This is an AI-generated candidate fix.' \
            '' \
            "- Source revision: ${{ inputs.ref }}" \
            "- Fixer workflow run: ${FORGEJO_RUN_ID}" \
            '- Grounding: repository flake.lock, evaluated flake diagnostics, and current Nix checks' \
            '- Deployment performed: no' \
            '- Merge performed: no' \
            '' \
            'Normal Forgejo CI must pass before this draft is considered for manual review.')"

          payload="$(jq --null-input \
            --arg base "$base" \
            --arg head "$branch" \
            --arg title "fix: AI suggestion for run ${FORGEJO_RUN_ID}" \
            --arg body "$body" \
            '{base: $base, head: $head, title: $title, body: $body, draft: true, assignees: ["forgejo"]}')"

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: token ${AI_FORGEJO_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/pulls" \
            | jq '{number, title, html_url}'
