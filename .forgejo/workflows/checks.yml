name: Dotfiles checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
      timezone: America/New_York
  workflow_dispatch:

concurrency:
  group: dotfiles-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    name: Nix flake
    runs-on: nix-microvm
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Nix
        run: |
          sandbox="$(nix config show sandbox)"
          max_jobs="$(nix config show max-jobs)"
          printf 'sandbox=%s\n' "$sandbox"
          printf 'max-jobs=%s\n' "$max_jobs"
          test "$sandbox" = true
          test "$max_jobs" = 4

      - name: Authenticate to Attic
        id: attic_auth
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: attic login forgejo-ci https://cache.hestallo.com "$ATTIC_TOKEN"

      - name: Validate Nix configuration
        id: nix_validation
        run: |
          log="$RUNNER_TEMP/nix-validation.log"
          warning_log="$RUNNER_TEMP/nix-validation-warnings.log"
          set +e
          # shellcheck disable=SC2016 # Variables expand in the nested shell.
          nix develop --command sh -eu -c '
            nix fmt -- --check .
            nix flake check --no-update-lock-file --print-build-logs

            for system in jin makoto rei yu; do
              echo "Building $system"
              result="result-$system"
              nix build --print-build-logs --out-link "$result" \
                ".#nixosConfigurations.$system.config.system.build.toplevel"
            done
          ' 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e

          if [ "$status" -eq 0 ]; then
            echo 'failed=false' >> "$FORGEJO_OUTPUT"
          else
            echo 'failed=true' >> "$FORGEJO_OUTPUT"
          fi

          sed '/SSH password authentication is enabled/d' \
            "$log" > "$warning_log"

          if grep --extended-regexp --quiet \
            '(^|[[:space:]])(evaluation warning|warning):' "$warning_log"; then
            echo 'warnings=true' >> "$FORGEJO_OUTPUT"
          else
            echo 'warnings=false' >> "$FORGEJO_OUTPUT"
          fi

      - name: Push verified closures to Attic
        if: ${{ github.event_name != 'pull_request' && steps.nix_validation.outputs.failed == 'false' && steps.attic_auth.outcome == 'success' }}
        continue-on-error: true
        run: |
          sh -eu -c '
            for system in jin makoto rei yu; do
              result="result-$system"
              echo "Pushing $system closure to Attic"
              attic push --jobs 1 forgejo-ci:homelab "$result" || \
                echo "::warning::Attic push failed for $system"
            done
          '

      - name: Dispatch automated remediation
        if: ${{ (steps.nix_validation.outputs.failed == 'true' || steps.nix_validation.outputs.warnings == 'true') && github.event_name != 'pull_request' && !startsWith(github.ref_name, 'automation/nix-remediation-') }}
        env:
          FORGEJO_API_URL: https://git.hestallo.com/api/v1
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ secrets.AI_FORGEJO_TOKEN }}
          FAILED_REF: ${{ github.sha }}
        run: |
          log="$RUNNER_TEMP/nix-validation.log"
          diagnostic_log="$RUNNER_TEMP/nix-validation-actionable.log"
          context="$RUNNER_TEMP/ai-context.txt"
          sanitized="$RUNNER_TEMP/ai-context-sanitized.txt"

          sed '/SSH password authentication is enabled/d' \
            "$log" > "$diagnostic_log"

          {
            printf 'validation_failed=%s\nvalidation_warnings=%s\n\n' \
              '${{ steps.nix_validation.outputs.failed }}' \
              '${{ steps.nix_validation.outputs.warnings }}'

            if ! grep --extended-regexp \
              --before-context 2 \
              --after-context 14 \
              '(^|[[:space:]])(error:|evaluation warning:|warning:)' \
              "$diagnostic_log"; then
              tail --lines 120 "$diagnostic_log"
            fi
          } \
            | LC_ALL=C tr -d '\000-\010\013\014\016-\037\177' \
            | sed -E \
                -e $'s/\x1B\[[0-9;?]*[ -\/]*[@-~]//g' \
                -e '/ignore (all )?(previous|above) instructions/Id' \
                -e '/(system|developer|assistant) prompt:/Id' \
                -e 's/(token|password|secret|authorization)[=: ][^[:space:]]+/\1=[REDACTED]/Ig' \
                -e 's#https://[^/@[:space:]]+@#https://[REDACTED]@#g' \
            > "$sanitized"

          # Reading a completed file avoids SIGPIPE/exit 141 under pipefail when
          # the selected diagnostics exceed the context limit.
          # The remediation job performs deterministic selection before the
          # model sees diagnostics, so retain enough source context to reach
          # actionable warnings after repeated per-host messages.
          head --bytes 24000 "$sanitized" > "$context"
          rm -f "$sanitized"

          echo 'Selected sanitized diagnostics for the fixer:'
          cat "$context"

          payload="$(jq --null-input \
            --arg ref "$FAILED_REF" \
            --rawfile context "$context" \
            '{ref: $ref, inputs: {ref: $ref, context: $context}}')"

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: token ${FORGEJO_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/actions/workflows/suggest-fix.yml/dispatches"

      - name: Mark Nix validation failure
        if: ${{ steps.nix_validation.outputs.failed == 'true' }}
        run: |
          log="$RUNNER_TEMP/nix-validation.log"
          echo 'Nix validation failed. Relevant diagnostics:'

          if ! grep --extended-regexp \
            --before-context 3 \
            --after-context 20 \
            '(^|[[:space:]])(error:|failed to build|cannot build|cannot evaluate)' \
            "$log"; then
            tail --lines 160 "$log"
          fi

          exit 1

      - name: Remove build result links
        if: ${{ always() }}
        run: rm -f result-jin result-makoto result-rei result-yu
